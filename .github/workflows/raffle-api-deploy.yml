name: Deploy Raffle API (New Site)

# The new Laravel/Inertia app (raffle-api/) is replacing the legacy
# WordPress site at rafflekings.com.ng -- same address, different files
# underneath. It needs its own build step (Composer dependencies and the
# Vite frontend build aren't committed to git -- see raffle-api/.gitignore
# -- so they have to be built fresh on every deploy) rather than the
# plain git-pull deploy.yml used for the old site.
#
# Reuses the SAME server login as the old site's deploy.yml (environment:
# production, secrets CPANEL_HOST / CPANEL_USERNAME / CPANEL_PASSWORD) and
# deploys to that exact same folder
# (/home2/worldin6/public_html/rafflekings.com.ng), replacing the old
# WordPress files there with this app -- that's the whole point of the
# swap. deploy.yml itself has been switched to manual-only so it can't
# fight this workflow for the same folder.
#
# One-time setup needed before this can safely run (all in cPanel, no
# commands, all account-owner-only -- I have no access to the live
# server):
#   1. SAFETY NET: in cPanel's File Manager, make a full COPY of the
#      current /home2/worldin6/public_html/rafflekings.com.ng folder
#      somewhere else first (e.g. rename a copy to
#      rafflekings-wordpress-backup). The first successful run of this
#      workflow deletes anything in that folder that isn't part of the
#      new app. This copy is how you'd undo the swap if anything looks
#      wrong afterward.
#   2. In MultiPHP Manager, set rafflekings.com.ng itself to PHP 8.3 (the
#      new app needs that exact version).
#   3. AFTER the first successful run (it will have placed a
#      .env.example file in that folder): rename it to .env, fill in the
#      real values (DB credentials, WP_LOGGED_IN_KEY, etc. -- the file's
#      own comments say where to find each one; reuse the same WordPress
#      database, don't create a new one), then re-run this workflow once
#      more so the new settings take effect.
# After that, every future push to main that touches raffle-api/ deploys
# automatically.
on:
  push:
    branches:
      - main
    paths:
      - 'raffle-api/**'
  workflow_dispatch: {}

env:
  DEPLOY_PATH: /home2/worldin6/public_html/rafflekings.com.ng

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raffle-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: raffle-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Sync source code to the server
        # Same password-based login the old site's deploy already uses.
        # rsync only sends what changed. --delete removes the old
        # WordPress files that aren't part of this app -- that's the
        # swap. It never touches the server's own .env file, uploaded
        # user files, logs, or database-backed cache/sessions -- this
        # workflow has no copy of those, they exist only on the server.
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass rsync
          sshpass -p "$CPANEL_PASSWORD" rsync -avzr --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='/storage/app/public/' \
            --exclude='/storage/logs/' \
            --exclude='/storage/framework/' \
            --exclude='.git' \
            ./ "$CPANEL_USERNAME@$CPANEL_HOST:${{ env.DEPLOY_PATH }}/"

      - name: Run post-deploy Laravel commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
