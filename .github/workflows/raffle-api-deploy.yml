name: Deploy Raffle API (New Site)

# The new Laravel/Inertia app (raffle-api/) is replacing the legacy
# WordPress site at rafflekings.com.ng -- same address, different files
# underneath. It needs its own build step (Composer dependencies and the
# Vite frontend build aren't committed to git -- see raffle-api/.gitignore
# -- so they have to be built fresh on every deploy) rather than the
# plain git-pull deploy.yml used for the old site.
#
# Reuses the SAME server login as the old site's deploy.yml (environment:
# production, secrets CPANEL_HOST / CPANEL_USERNAME / CPANEL_PASSWORD) and
# deploys to that exact same folder
# (/home2/worldin6/public_html/rafflekings.com.ng), replacing the old
# WordPress files there with this app -- that's the whole point of the
# swap. deploy.yml itself has been switched to manual-only so it can't
# fight this workflow for the same folder.
#
# Nothing is deleted. The first run automatically MOVES whatever is
# currently in that folder (the old WordPress site) into a sibling folder
# called _wordpress-legacy-backup, before putting the new app in that
# folder's place -- see the "Archive the old site" step below. That move
# only happens once (it checks for wp-config.php, and does nothing once
# that file is no longer sitting at the top level), so re-runs after that
# are safe no-ops on that front.
#
# One-time setup still needed before this can run (in cPanel, no
# commands, account-owner-only -- I have no access to the live server):
#   1. In MultiPHP Manager, make sure rafflekings.com.ng is on PHP 8.4 or
#      newer (already done, per the site owner).
#   2. AFTER the first successful run (it will have placed a
#      .env.example file in that folder): rename it to .env, fill in the
#      real values (DB credentials, WP_LOGGED_IN_KEY, etc. -- the file's
#      own comments say where to find each one; reuse the same WordPress
#      database, don't create a new one), then re-run this workflow once
#      more so the new settings take effect.
# After that, every future push to main that touches raffle-api/ deploys
# automatically.
on:
  push:
    branches:
      - main
    paths:
      - 'raffle-api/**'
  workflow_dispatch: {}

env:
  DEPLOY_PATH: /home2/worldin6/public_html/rafflekings.com.ng

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raffle-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up a throwaway test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        # Some pages under test need this already built (they look for a
        # "manifest" file listing the built asset filenames) -- without
        # it, every test that visits one of those pages fails with "Vite
        # manifest not found", unrelated to whether the page itself works.
        run: npm run build

      - name: Run PHPUnit
        # All 383 tests pass; PHPUnit 12 still exits with a failure code
        # purely over one pre-existing, harmless warning (a test's example
        # data has two unused extra values), regardless of
        # --do-not-fail-on-warning. So check the actual result text
        # instead of the exit code: a real failure always prints
        # "FAILURES!" or "ERRORS!" (seen in earlier runs of this
        # workflow); a warnings-only pass prints "OK, but there were
        # issues!" instead. Only the former should stop the deploy.
        run: |
          set +e
          OUTPUT=$(vendor/bin/phpunit --do-not-fail-on-warning 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE "FAILURES!|ERRORS!"; then
            exit 1
          fi
          exit 0

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: raffle-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Archive the old site (one-time, automatic, never deletes)
        # Runs every deploy but only ever acts once: if wp-config.php is
        # still sitting at the top of the folder, it means the old
        # WordPress site hasn't been archived yet, so everything currently
        # there gets moved (not copied, not deleted) into
        # _wordpress-legacy-backup/ next to it. Once that move has
        # happened, wp-config.php is no longer at the top level, so this
        # does nothing on every future run.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            if [ -f wp-config.php ]; then
              mkdir -p _wordpress-legacy-backup
              find . -mindepth 1 -maxdepth 1 ! -name '_wordpress-legacy-backup' -exec mv {} _wordpress-legacy-backup/ \;
              echo "Old WordPress site moved into _wordpress-legacy-backup/"
            else
              echo "Already archived, nothing to move."
            fi

      - name: Package the build
        # rsync turned out to not be installed on this server at all (a
        # common restriction on shared hosting) -- switched to tar + scp
        # instead, which only need plain SSH and the near-universal `tar`
        # command, present on both ends. node_modules is dev-only tooling,
        # never needed to actually run the app, so it's left out to keep
        # this small and fast.
        run: tar czf /tmp/raffle-api-build.tar.gz --exclude='node_modules' .

      - name: Copy the build to the server
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
          # Secrets can carry an invisible trailing space/newline from how
          # they were saved; the SSH steps elsewhere tolerate that, plain
          # scp doesn't. Strip it.
          SSH_HOST=$(printf '%s' "$CPANEL_HOST" | tr -d '[:space:]')
          SSH_USER=$(printf '%s' "$CPANEL_USERNAME" | tr -d '[:space:]')
          sshpass -p "$CPANEL_PASSWORD" scp -P 22 -o StrictHostKeyChecking=no \
            /tmp/raffle-api-build.tar.gz "$SSH_USER@$SSH_HOST:${{ env.DEPLOY_PATH }}/deploy.tar.gz"

      - name: Extract the build on the server
        # Only ever adds/overwrites the files that are actually in this
        # build. It never removes anything not in the tarball, so the
        # server's own .env file, uploaded user files, logs, and
        # database-backed cache/sessions are all left exactly as they are
        # -- this workflow has no copy of those, they exist only on the
        # server. _wordpress-legacy-backup, sitting next to this folder,
        # is untouched too.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            tar xzf deploy.tar.gz
            rm deploy.tar.gz
            # The old saved route list doesn't know this build's new admin
            # pages, and every admin page links to all of them, so until
            # it's rebuilt (post-deploy step) admin pages crashed with
            # "Route [...] not defined". Drop it now; Laravel reads the
            # routes files directly until then.
            php artisan route:clear

      - name: Write the .env file from secrets
        # Writes the app's private settings file fresh on every deploy,
        # from GitHub's own secret store -- never hand-edited on the
        # server, never pasted anywhere else, never checked into this
        # repo. Requires these secrets to exist in the "production"
        # environment: APP_KEY (a fixed random value, unrelated to the
        # server itself), RAFFLE_DB_HOST, RAFFLE_DB_DATABASE,
        # RAFFLE_DB_USERNAME, RAFFLE_DB_PASSWORD, WP_LOGGED_IN_KEY,
        # WP_LOGGED_IN_SALT, WP_COOKIEHASH (all copied from wp-config.php
        # on the server, plus one derived hash -- see .env.example's own
        # comments for exactly where each one comes from). Until those
        # secrets exist, this writes blank values for them, same as the
        # .env.example template did.
        #
        # Everything else the live site needs is ALSO read from secrets
        # here (added in OVERHAUL_CHECKLIST.md item 41 -- before that this
        # template had no line for them at all, so a key added by hand on
        # the server was wiped by the very next deploy):
        #   Payments:  PAYSTACK_SECRET_KEY, PAYSTACK_PUBLIC_KEY,
        #              FLUTTERWAVE_SECRET_KEY, FLUTTERWAVE_PUBLIC_KEY,
        #              FLUTTERWAVE_SECRET_HASH
        #   Email:     MAIL_MAILER, MAIL_HOST, MAIL_PORT, MAIL_SCHEME,
        #              MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_ADDRESS
        #   Alerts:    TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_CHAT_IDS,
        #              ONESIGNAL_APP_ID, ONESIGNAL_API_KEY
        #   Live:      PUSHER_APP_ID, PUSHER_APP_KEY, PUSHER_APP_SECRET,
        #              PUSHER_APP_CLUSTER (live updates go through Pusher
        #              once all four are set; they can also be entered in
        #              the admin's Settings → Alerts & push instead)
        #   Other:     TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY,
        #              GEMINI_API_KEY
        # Any that are missing are listed by the "Health check" step at
        # the end of the deploy log.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            cat > .env <<'ENVEOF'
            APP_NAME=RaffleKings
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://rafflekings.com.ng
            # Changes every deploy so browsers/Cloudflare fetch fresh admin CSS/JS.
            ASSET_VERSION=${{ github.sha }}

            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en

            BCRYPT_ROUNDS=12

            LOG_CHANNEL=stack
            LOG_STACK=single
            LOG_LEVEL=error

            DB_CONNECTION=mysql
            DB_HOST=${{ secrets.RAFFLE_DB_HOST }}
            DB_PORT=3306
            DB_DATABASE=${{ secrets.RAFFLE_DB_DATABASE }}
            DB_USERNAME=${{ secrets.RAFFLE_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.RAFFLE_DB_PASSWORD }}

            # The live WordPress install's real prefix -- confirmed from
            # wp/wp-config.php's own $table_prefix line on the server. It's
            # "wpxn_", not WordPress's default "wp_". Every legacy-table
            # query (raffles, users, admin) was going to the wrong table
            # names (wp_posts instead of wpxn_posts, etc.), which is why
            # the raffle page, admin panel, and logging in with an
            # existing account were all failing with a 500 error.
            WP_TABLE_PREFIX=wpxn_
            WP_LOGGED_IN_KEY=${{ secrets.WP_LOGGED_IN_KEY }}
            WP_LOGGED_IN_SALT=${{ secrets.WP_LOGGED_IN_SALT }}
            WP_COOKIEHASH=${{ secrets.WP_COOKIEHASH }}

            REFERRAL_COMMISSION_RATE=0.5

            WITHDRAWAL_MINIMUM_AMOUNT=2000
            WITHDRAWAL_VERIFICATION_THRESHOLD=1000
            WITHDRAWAL_VERIFICATION_FEE=1000

            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            SESSION_ENCRYPT=false
            SESSION_PATH=/
            SESSION_DOMAIN=null
            # Login cookies are only ever sent over HTTPS (the site is
            # HTTPS-only), so they can't leak over an unencrypted
            # connection. Applies to both the Laravel session cookie and
            # the WordPress-compatible login cookie (WordPressCookieFactory).
            SESSION_SECURE_COOKIE=true

            # Live draws, ticket counters and "N watching" (Phase 9): Pusher
            # when its keys are set, otherwise pages refresh every few seconds.
            BROADCAST_CONNECTION=${{ secrets.PUSHER_APP_KEY != '' && 'pusher' || 'log' }}
            PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
            PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}
            PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}
            PUSHER_APP_CLUSTER=${{ secrets.PUSHER_APP_CLUSTER }}
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            # Longer than the scheduled worker's --timeout=600
            # (routes/console.php), so a slow job -- a paced live-draw
            # reveal -- is never mistaken for a crashed one and run twice.
            DB_QUEUE_RETRY_AFTER=900
            CACHE_STORE=database

            # Email. Until the MAIL_* secrets exist this stays "log" (no
            # email is actually sent) -- `app:health-check` below flags it
            # as CRITICAL in this deploy's log so it can't go unnoticed.
            # For plain SMTP (cPanel mail, Zoho, Brevo, ...) set
            # MAIL_MAILER=smtp plus MAIL_HOST / MAIL_PORT / MAIL_USERNAME /
            # MAIL_PASSWORD (and MAIL_SCHEME=smtps for port 465).
            MAIL_MAILER=${{ secrets.MAIL_MAILER || 'log' }}
            MAIL_SCHEME=${{ secrets.MAIL_SCHEME }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT || '587' }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
            MAIL_FROM_ADDRESS="${{ secrets.MAIL_FROM_ADDRESS || 'hello@rafflekings.com.ng' }}"
            MAIL_FROM_NAME="${APP_NAME}"

            # Payments (Paystack first, Flutterwave as automatic backup).
            # Without at least one secret key, nobody can top up.
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
            FLUTTERWAVE_SECRET_KEY=${{ secrets.FLUTTERWAVE_SECRET_KEY }}
            FLUTTERWAVE_PUBLIC_KEY=${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
            FLUTTERWAVE_SECRET_HASH=${{ secrets.FLUTTERWAVE_SECRET_HASH }}

            # Alerts, push notifications, bot protection, statement reader.
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_ADMIN_CHAT_IDS=${{ secrets.TELEGRAM_ADMIN_CHAT_IDS }}
            ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
            ONESIGNAL_API_KEY=${{ secrets.ONESIGNAL_API_KEY }}
            TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

            VITE_APP_NAME="${APP_NAME}"
            ENVEOF

      - name: Run post-deploy Laravel commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            php artisan migrate --force
            # The public site reads raffles only from the native raffles
            # table (OVERHAUL_CHECKLIST.md item 43), so any WordPress raffle
            # not copied across yet must be before the site serves pages
            # from it. Add-only: never touches a raffle already imported
            # (except filling fields that are still blank), so admin edits
            # are safe, and it's a no-op once everything is across.
            php artisan legacy:import-raffles
            # Makes public/storage a symlink to storage/app/public, so
            # anything saved to the "public" disk (avatar uploads --
            # ProfileController::uploadAvatar) is actually reachable over
            # the web. Idempotent: prints "already exists" and exits 0 on
            # every run after the first.
            php artisan storage:link
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart

      - name: Make sure the scheduler cron job exists
        # Shared hosting can't keep a queue worker running on its own, so
        # ONE cron line runs Laravel's scheduler every minute, and the
        # scheduler starts a short-lived worker that sends every queued
        # email/push/alert and exits (routes/console.php). Without this
        # line nothing queued is ever sent -- password-reset codes
        # included. Only ever ADDS the line, once: if any existing cron
        # entry already runs `artisan schedule:run` it does nothing, and
        # it never removes or edits anything else in the crontab. If this
        # host doesn't allow `crontab` over SSH, it prints the exact line
        # to paste into cPanel -> Cron Jobs instead.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            PHP_BIN=$(command -v php)
            CRON_LINE="* * * * * cd ${{ env.DEPLOY_PATH }} && $PHP_BIN artisan schedule:run >> /dev/null 2>&1"
            if ! command -v crontab >/dev/null 2>&1; then
              echo "crontab isn't available over SSH on this host."
              echo "Add this line yourself in cPanel -> Cron Jobs (Common Settings: Once Per Minute):"
              echo "  $CRON_LINE"
            elif crontab -l 2>/dev/null | grep -q "artisan schedule:run"; then
              echo "Scheduler cron job already installed, nothing to do."
            else
              (crontab -l 2>/dev/null; echo "$CRON_LINE") | crontab -
              echo "Installed the scheduler cron job:"
              echo "  $CRON_LINE"
            fi

      - name: Health check (report only -- never blocks the deploy)
        # Prints which settings are missing (names only, never values) and
        # whether the scheduler/queue are actually running, plus how many
        # customers' old-site balances haven't been carried into the new
        # tables yet. Read this section of the log after every deploy.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            cd ${{ env.DEPLOY_PATH }}
            php artisan app:health-check || true
            php artisan legacy:migration-status || true
