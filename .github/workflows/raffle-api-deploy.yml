name: Deploy Raffle API (New Site)

# The new Laravel/Inertia app (raffle-api/) is a separate application from
# the legacy WordPress site deploy.yml handles, and needs its own home on
# the server (its own subdomain/folder) plus its own build step (Composer
# dependencies and the Vite frontend build aren't committed to git — see
# raffle-api/.gitignore — so they have to be built fresh on every deploy).
#
# One-time setup needed before this workflow can run (nobody but the
# account owner can do this, it needs the live cPanel account):
#   1. Create the subdomain/app folder on cPanel that this should live at
#      (e.g. api.rafflekings.com.ng), pointed at an EMPTY folder.
#   2. Add these secrets under a new GitHub "raffle-api-production"
#      environment (Settings -> Environments in this repo): RAFFLE_API_HOST,
#      RAFFLE_API_USERNAME, RAFFLE_API_PASSWORD, RAFFLE_API_PATH (the empty
#      folder's full path on the server, e.g.
#      /home2/worldin6/api.rafflekings.com.ng).
#   3. On that same server, copy raffle-api/.env.example to .env in that
#      folder and fill in the real values (DB credentials, WP_LOGGED_IN_KEY,
#      etc. — see the comments in .env.example for where to find each one),
#      then run `php artisan key:generate` once.
# After that one-time setup, every push to main that touches raffle-api/
# deploys automatically — no further manual commands.
on:
  push:
    branches:
      - main
    paths:
      - 'raffle-api/**'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raffle-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: raffle-api-production
    defaults:
      run:
        working-directory: raffle-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Sync source code to the server
        # Same password-based login the main site's deploy already uses
        # (no new SSH key to create). rsync only sends what changed, and
        # never touches the server's own .env file, uploaded user files,
        # logs, or database-backed cache/sessions — this workflow has no
        # copy of those, they exist only on the server.
        env:
          RAFFLE_API_HOST: ${{ secrets.RAFFLE_API_HOST }}
          RAFFLE_API_USERNAME: ${{ secrets.RAFFLE_API_USERNAME }}
          RAFFLE_API_PASSWORD: ${{ secrets.RAFFLE_API_PASSWORD }}
          RAFFLE_API_PATH: ${{ secrets.RAFFLE_API_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y sshpass rsync
          sshpass -p "$RAFFLE_API_PASSWORD" rsync -avzr --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='/storage/app/public/' \
            --exclude='/storage/logs/' \
            --exclude='/storage/framework/' \
            --exclude='.git' \
            ./ "$RAFFLE_API_USERNAME@$RAFFLE_API_HOST:$RAFFLE_API_PATH/"

      - name: Run post-deploy Laravel commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.RAFFLE_API_HOST }}
          username: ${{ secrets.RAFFLE_API_USERNAME }}
          password: ${{ secrets.RAFFLE_API_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.RAFFLE_API_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
