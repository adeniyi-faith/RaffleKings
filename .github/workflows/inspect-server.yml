name: Inspect Server State (read-only)

# A one-off, read-only diagnostic: looks at the live site's folder without
# changing anything, so we know exactly what's there before touching it
# again. Safe to run any time.
on:
  workflow_dispatch: {}

env:
  DEPLOY_PATH: /home2/worldin6/public_html/rafflekings.com.ng

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Look, don't touch
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            cd ${{ env.DEPLOY_PATH }}
            echo "=== Is this a git checkout? ==="
            git status 2>&1 || echo "(not a git repo, or git status failed)"
            echo
            echo "=== Last commit here, if any ==="
            git log -1 2>&1 || true
            echo
            echo "=== Files git thinks changed vs. that commit ==="
            git diff --stat 2>&1 || true
            echo
            echo "=== Untracked files/folders git doesn't know about ==="
            git status --porcelain 2>&1 | grep '^??' || echo "(none)"
            echo
            echo "=== Does a legacy backup folder already exist? ==="
            ls -la _wordpress-legacy-backup 2>&1 || echo "(does not exist)"
            echo
            echo "=== Does the wp subfolder still look intact? ==="
            ls -la wp/wp-config.php 2>&1 || echo "(missing!)"
            echo
            echo "=== Restoring the 3 files the raffle-api tar accidentally overwrote ==="
            git checkout -- .gitignore composer.json phpunit.xml 2>&1
            git status --short 2>&1 || true
            echo
            echo "=== Is there a .env file, and does it have real DB/APP_KEY values (not printing secrets)? ==="
            if [ -f .env ]; then
              echo "APP_ENV=$(grep -E '^APP_ENV=' .env | cut -d= -f2-)"
              echo "APP_DEBUG=$(grep -E '^APP_DEBUG=' .env | cut -d= -f2-)"
              for key in APP_KEY DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD WP_LOGGED_IN_KEY WP_LOGGED_IN_SALT WP_COOKIEHASH; do
                val=$(grep -E "^${key}=" .env | cut -d= -f2-)
                if [ -z "$val" ]; then echo "$key=<EMPTY>"; else echo "$key=<set>"; fi
              done
            else
              echo "(.env does not exist!)"
            fi
            echo
            echo "=== storage/ and bootstrap/cache/ writable? ==="
            ls -ld storage bootstrap/cache 2>&1 || true
            echo
            echo "=== Last 100 lines of storage/logs/laravel.log ==="
            tail -n 100 storage/logs/laravel.log 2>&1 || echo "(no laravel.log)"
            echo
            echo "=== PHP version actually running ==="
            php -v 2>&1 || true
            echo
            echo "=== php artisan about (routes/config sanity) ==="
            php artisan about 2>&1 || true
            echo
            echo "=== WordPress's own \$table_prefix (from wp/wp-config.php) ==="
            grep -E '^\s*\$table_prefix' wp/wp-config.php 2>&1 || echo "(not found)"
            echo
            echo "=== What tables actually exist in the configured DB (first 40) ==="
            php artisan tinker --execute="foreach (array_slice(array_map('current', DB::select('SHOW TABLES')), 0, 40) as \$t) { echo \$t, PHP_EOL; }" 2>&1 || true
            echo
            echo "=== composer.json 'name' + autoload (did the tarball overwrite this?) ==="
            grep -E '"name"|"App\\\\\\\\"' composer.json 2>&1 || true
            echo
            echo "=== Live HTTP status for the pages that were 500ing (read-only GETs) ==="
            for path in / /raffles /login /admin; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://rafflekings.com.ng${path}" || echo "curl-failed")
              echo "GET ${path} -> ${code}"
            done
            echo
            echo "=== Newest error message (not just stack trace) from laravel.log ==="
            tail -n 400 storage/logs/laravel.log 2>&1 | grep -E '^\[.*production\.(ERROR|CRITICAL)' | tail -n 5 || echo "(no matching error line)"

      - name: Go live -- route requests to the new app
        # The actual switch: the new app's real front door is
        # public/index.php, one folder down from here, but this domain's
        # address points at THIS folder. Adding a rewrite rule here that
        # forwards every request into public/ is the standard way to run
        # a Laravel app on shared hosting without cPanel-level control
        # over the document root. The old .htaccess (the legacy site's
        # own rewrite rules) is backed up first, once, never deleted.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            if [ ! -f .htaccess.legacy-backup ]; then
              cp .htaccess .htaccess.legacy-backup
              echo "Backed up the old .htaccess to .htaccess.legacy-backup"
            else
              echo "Old .htaccess already backed up, leaving it alone."
            fi
            cat > .htaccess <<'HTACCESSEOF'
            <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteCond %{REQUEST_URI} !^/public
                RewriteRule ^(.*)$ public/$1 [L]
            </IfModule>
            HTACCESSEOF
            echo "New site is now live."
