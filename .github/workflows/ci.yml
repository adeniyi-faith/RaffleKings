name: CI

# Runs on every push to main and on every pull request.
#   1. "secrets"  looks for a password, token or key committed by mistake.
#      It shows a warning without blocking the build.
#   2. "lint"     checks that every PHP file in the website (raffle-api/)
#      has no typing mistakes that would crash it.
# The website's full tests run in their own workflow:
# raffle-api-tests-mysql.yml (and again inside the deploy workflow).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          # Shows what it finds without failing the build (the test files
          # contain made-up keys on purpose).
          ./gitleaks detect --source . --no-banner --redact --no-git || echo "::warning::gitleaks found possible secrets (see the log above)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Syntax-check every PHP file in the website
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || { php -l "$file"; status=1; }
          done < <(find raffle-api -path raffle-api/vendor -prune -o -path raffle-api/node_modules -prune -o -name '*.php' -print0)
          exit $status
