name: CI

# Phase 0 item 4: the live PHP site had no tests at all and deployed
# straight to production on every push to main. This workflow is the gate —
# (The old site's deploy.yml used to require it; that workflow was removed
# when the old site was archived. These checks still guard the legacy code
# until it is deleted in item 40.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    # Looks for a password, token or key committed by mistake. It shows a
    # warning without blocking the build until its first results are checked;
    # remove continue-on-error to make it block.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          # Shows what it finds without failing the build until the first results
          # have been looked through (then delete the "|| echo" part to enforce it).
          ./gitleaks detect --source . --no-banner --redact --no-git || echo "::warning::gitleaks found possible secrets (see the log above)"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Syntax-check every PHP file in the live app
        # Catches fatal parse errors before they ever reach production — the
        # cheapest, highest-value check available given the app has no
        # framework-level static analysis set up yet. Skips vendor/ and the
        # separate raffle-api/ Laravel app, which lints itself.
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . \
            -path ./raffle-api -prune -o \
            -path './*/vendor' -prune -o \
            -path ./node_modules -prune -o \
            -path ./.git -prune -o \
            -name '*.php' -print0)
          exit $status

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit
